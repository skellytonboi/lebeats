<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n3xt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#05120b;color:#fff;font-family:ui-sans-serif,system-ui,sans-serif;min-height:100vh}
.topnav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(5,18,11,.85);backdrop-filter:blur(8px);border-bottom:1px solid rgba(16,185,129,.2)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.topnav nav{display:flex;gap:4px;flex-wrap:wrap}
.navbtn{background:transparent;border:1px solid transparent;color:rgba(255,255,255,.7);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn.active{background:rgba(16,185,129,.2);color:#6ee7b7;border-color:rgba(16,185,129,.3)}
.sec{max-width:1100px;margin:0 auto;padding:32px 24px 80px}
h1{text-align:center;font-size:36px;font-weight:800}
.tag{text-align:center;color:rgba(255,255,255,.5);font-size:14px;margin-top:6px}
input[type=text]{width:100%;max-width:480px;margin:18px auto 0;display:block;background:rgba(0,0,0,.3);border:1px solid rgba(16,185,129,.2);border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none}
input[type=text]:focus{border-color:rgba(52,211,153,.5)}
.sub{text-align:center;color:rgba(255,255,255,.5);font-size:14px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:22px}
.card{overflow:hidden;border-radius:12px;border:1px solid rgba(16,185,129,.1);background:rgba(0,0,0,.3);cursor:pointer;transition:.15s}
.card:hover{border-color:rgba(52,211,153,.4)}
.card .ph,.card img{aspect-ratio:1;width:100%;display:flex;align-items:center;justify-content:center;object-fit:cover}
.card .ph{font-size:26px;font-weight:700;color:rgba(255,255,255,.85)}
.card .tape{background:linear-gradient(135deg,#1f2937,#111827)}
.card p{padding:6px 8px;font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px;margin-top:22px}
.appcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,.06);background:#141c1e}
.appicon{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff}
.appcard span{font-size:11px;color:rgba(255,255,255,.6)}
.shortcuts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.shortcut{padding:10px 16px;border-radius:10px;border:1px solid rgba(16,185,129,.2);background:rgba(0,0,0,.3);color:#fff;cursor:pointer;font-size:14px}
.shortcut:hover{background:rgba(16,185,129,.2)}
.results{max-width:480px;margin:8px auto 0;display:none}
.r-item{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.85);font-size:14px;text-decoration:none}
.r-item:hover{background:rgba(255,255,255,.06)}
.r-kind{font-size:10px;text-transform:uppercase;color:#6ee7b7;background:rgba(16,185,129,.15);padding:2px 6px;border-radius:6px}
.r-empty{padding:12px;color:rgba(255,255,255,.4);font-size:14px}
.upd{border:1px solid rgba(16,185,129,.15);background:rgba(0,0,0,.3);border-radius:16px;padding:18px;margin-top:16px}
.upd-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.upd-v{color:#6ee7b7;font-weight:600}
.upd-d{color:rgba(255,255,255,.4);font-size:12px}
.upd ul{margin-top:10px;list-style:none}
.upd li{position:relative;padding-left:14px;color:rgba(255,255,255,.7);font-size:14px;margin-top:6px}
.upd li:before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:rgba(52,211,153,.7)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;flex-direction:column}
.modal.show{display:flex}
.modal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.1);background:#000}
.modal-bar .t{color:rgba(255,255,255,.85);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-bar button{background:rgba(16,185,129,.2);color:#a7f3d0;border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;margin-left:6px}
.modal-bar button:hover{background:rgba(16,185,129,.3)}
.modal iframe{flex:1;width:100%;border:0;background:#000}
@media(max-width:600px){.grid,.appgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
</style>
</head>

var BASE='https://truffled.lol';
function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;';});}
function coverUrl(g){var n=norm(g.name);if(DATA.covers[n])return DATA.covers[n];if(g.thumbnail){var t=g.thumbnail;return t.charAt(0)==='/'?BASE+t:BASE+'/'+t;}return null;}
function hashStr(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h);}
function phStyle(name){var h=hashStr(name);var hue=h%360;var hue2=(hue+40)%360;return 'background:linear-gradient(135deg,hsl('+hue+',60%,30%),hsl('+hue2+',60%,18%));';}
function initials(name){var p=name.replace(/[^a-zA-Z0-9 ]/g,'').trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)||'';}).join('').toUpperCase();return p||name.charAt(0)||'?';}
function playSrc(g){var ft=g.frameType||'iframe';if(ft==='drivehtml')return g.driveId?'https://drive.google.com/file/d/'+g.driveId+'/preview':'';if(ft==='unity')return BASE+'/unityframe.html?url='+encodeURIComponent(g.url||'');if(/^https?:/i.test(g.url||''))return g.url;var u=g.url||'';return u.charAt(0)==='/'?BASE+u:BASE+'/'+u;}
function toolSrc(t){return t.path.charAt(0)==='/'?BASE+t.path:BASE+'/'+t.path;}
function show(id){['home','games','movies','tools','apps','updates'].forEach(function(s){$('sec-'+s).style.display=(s===id?'block':'none');});[].forEach.call(document.querySelectorAll('.navbtn'),function(b){b.classList.toggle('active',b.dataset.s===id);});window.scrollTo(0,0);}
function gameCard(g){var cu=coverUrl(g);var img=cu?'<img loading="lazy" src="'+esc(cu)+'" alt="'+esc(g.name)+'">':'<div class="ph" style="'+phStyle(g.name)+'"><span>'+esc(initials(g.name))+'</span></div>';return '<div class="card" data-name="'+esc(g.name)+'" data-kind="game">'+img+'<p>'+esc(g.name)+'</p></div>';}
function toolCard(t){var src=t.thumb?(t.thumb.charAt(0)==='/'?BASE+t.thumb:BASE+'/'+t.thumb):'';var img=src?'<img loading="lazy" src="'+esc(src)+'" alt="'+esc(t.name)+'">':'<div class="ph"><span>'+esc(initials(t.name))+'</span></div>';return '<div class="card" data-name="'+esc(t.name)+'" data-kind="tool">'+img+'<p>'+esc(t.name)+'</p></div>';}
function movieCard(m){return '<div class="card" data-name="'+esc(m.name)+'" data-kind="movie"><div class="ph tape"><span>'+esc(initials(m.name))+'</span></div><p>'+esc(m.name)+'</p></div>';}
function appCard(a){return '<a class="appcard" href="'+esc(a.url)+'" target="_blank" rel="noreferrer"><div class="appicon" style="background:'+esc(a.color)+'">'+esc(a.letter)+'</div><span>'+esc(a.name)+'</span></a>';}
function renderGames(l){$('games-grid').innerHTML=l.map(gameCard).join('');$('games-count').textContent='Showing all '+l.length+' games';}
function renderTools(l){$('tools-grid').innerHTML=l.map(toolCard).join('');$('tools-count').textContent='Showing all '+l.length+' tools';}
function renderMovies(l){$('movies-grid').innerHTML=l.map(movieCard).join('');$('movies-count').textContent=l.length+' movies ready to play';}
function renderApps(l){$('apps-grid').innerHTML=l.map(appCard).join('');$('apps-count').textContent='Showing all '+l.length+' apps';}
function renderUpdates(l){$('updates-list').innerHTML=l.map(function(u){return '<div class="upd"><div class="upd-h"><span class="upd-v">'+esc(u.version)+' \u2014 '+esc(u.title)+'</span><span class="upd-d">'+esc(u.date||'')+'</span></div><ul>'+(u.items||[]).map(function(it){return '<li>'+esc(it)+'</li>';}).join('')+'</ul></div>';}).join('');}
function findG(name){return DATA.games.filter(function(x){return x.name===name;})[0];}
function findT(name){return DATA.tools.filter(function(x){return x.name===name;})[0];}
function findM(name){return DATA.movies.filter(function(x){return x.name===name;})[0];}
function openPlay(title,src){$('play-title').textContent=title;$('play-frame').src=src;$('play-modal').classList.add('show');}
function closePlay(){$('play-modal').classList.remove('show');$('play-frame').src='';}
function openMovie(m){$('movie-title').textContent=m.name;$('movie-frame').src=m.preview;$('movie-modal').classList.add('show');}
function closeMovie(){$('movie-modal').classList.remove('show');$('movie-frame').src='';}
function homeSearch(q){q=q.toLowerCase();var r=[];DATA.games.forEach(function(g){if(g.name.toLowerCase().indexOf(q)>=0)r.push({k:'game',n:g.name});});DATA.movies.forEach(function(m){if(m.name.toLowerCase().indexOf(q)>=0)r.push({k:'movie',n:m.name});});DATA.tools.forEach(function(t){if(t.name.toLowerCase().indexOf(q)>=0)r.push({k:'tool',n:t.name});});DATA.apps.forEach(function(a){if(a.name.toLowerCase().indexOf(q)>=0)r.push({k:'app',n:a.name,o:a});});return r.slice(0,50);}
function init(){
 renderGames(DATA.games);renderTools(DATA.tools);renderMovies(DATA.movies);renderApps(DATA.apps);renderUpdates(DATA.updates);
 document.body.addEventListener('click',function(e){var c=e.target.closest('.card');if(!c)return;var kind=c.dataset.kind,name=c.dataset.name;if(kind==='game'){var g=findG(name);if(g)openPlay(g.name,playSrc(g));}else if(kind==='tool'){var t=findT(name);if(t)openPlay(t.name,toolSrc(t));}else if(kind==='movie'){var m=findM(name);if(m)openMovie(m);}});
 ['games','tools','movies','apps'].forEach(function(s){var inp=$('q-'+s);if(inp)inp.addEventListener('input',function(){var q=inp.value.toLowerCase();if(s==='games')renderGames(DATA.games.filter(function(g){return g.name.toLowerCase().indexOf(q)>=0;}));if(s==='tools')renderTools(DATA.tools.filter(function(t){return t.name.toLowerCase().indexOf(q)>=0;}));if(s==='movies')renderMovies(DATA.movies.filter(function(m){return m.name.toLowerCase().indexOf(q)>=0;}));if(s==='apps')renderApps(DATA.apps.filter(function(a){return a.name.toLowerCase().indexOf(q)>=0;}));});});
 $('home-search').addEventListener('input',function(){var q=$('home-search').value.trim().toLowerCase();var box=$('home-results');if(!q){box.innerHTML='';box.style.display='none';return;}var res=homeSearch(q);if(!res.length){box.innerHTML='<div class="r-empty">no results</div>';box.style.display='block';return;}box.innerHTML=res.map(function(r){if(r.k==='app')return '<a class="r-item" href="'+esc(r.o.url)+'" target="_blank" rel="noreferrer"><span class="r-kind">app</span>'+esc(r.n)+'</a>';return '<div class="r-item" data-kind="'+r.k+'" data-name="'+esc(r.n)+'"><span class="r-kind">'+r.k+'</span>'+esc(r.n)+'</div>';}).join('');box.style.display='block';});
 $('home-results').addEventListener('click',function(e){var it=e.target.closest('.r-item');if(!it||it.tagName==='A')return;var kind=it.dataset.kind,name=it.dataset.name;if(kind==='game'){var g=findG(name);if(g)openPlay(g.name,playSrc(g));}else if(kind==='tool'){var t=findT(name);if(t)openPlay(t.name,toolSrc(t));}else if(kind==='movie'){var m=findM(name);if(m)openMovie(m);}});
 [].forEach.call(document.querySelectorAll('.navbtn'),function(b){b.addEventListener('click',function(){show(b.dataset.s);});});
 [].forEach.call(document.querySelectorAll('.shortcut'),function(s){s.addEventListener('click',function(){show(s.dataset.s);});});
 $('play-close').addEventListener('click',closePlay);
 $('movie-close').addEventListener('click',closeMovie);
 $('play-fs').addEventListener('click',function(){var f=$('play-frame');if(f.requestFullscreen)f.requestFullscreen();});
 show('home');
 var b=$('boot'); if(b) b.style.display='none';
 }
 try{init();}catch(e){var b=document.getElementById('boot');if(b){b.textContent='error: '+e.message;b.style.color='#fca5a5';}}
</script>
